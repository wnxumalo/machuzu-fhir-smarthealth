<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="List Diagnosis"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
         
            <p:growl id="growl">
                <p:autoUpdate/>
            </p:growl>

            <h3>Diagnosis</h3>
            
            <h:form id="DiagnosisListForm">
                
                <p:panel id="pnlUserHome" header="Identifier">
                    <h:panelGrid columns="10" rendered="#{!empty identifierController.selected}" cellspacing="10px;" style="width:100%;" >
                        <h:outputText value="ID" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.id}"/>                    
                        <h:outputText value="USE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.use}"/>                                            
                        <h:outputText value="VALUE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.value}"/>                    
                        <h:outputText value="TYPE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.IType}"/>
                    </h:panelGrid>
                </p:panel>

                <p:panel header="List Diagnosis">
                    <p:dataTable id="datalist" value="#{diagnosisController.items}" var="item"
                                 selectionMode="single" selection="#{diagnosisController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Diagnosis Id"/>
                            </f:facet>
                            <h:outputText value="#{item.diagID}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Chapter #"/>
                            </f:facet>
                            <h:outputText value="#{item.chapterNo}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Chapter Descsription"/>
                            </f:facet>
                            <h:outputText value="#{item.chapterDesc}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Group Code"/>
                            </f:facet>
                            <h:outputText value="#{item.groupCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Group Description"/>
                            </f:facet>
                            <h:outputText value="#{item.groupDescription}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="ICD3 Code"/>
                            </f:facet>
                            <h:outputText value="#{item.ICD3Code}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="ICD3 Code Desc"/>
                            </f:facet>
                            <h:outputText value="#{item.ICD3CodeDesc}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="ICD10 Code"/>
                            </f:facet>
                            <h:outputText value="#{item.ICD10Code}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="WHO FULL Description"/>
                            </f:facet>
                            <h:outputText value="#{item.WHOFULLDesc}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="ICD10 Clinical Use"/>
                            </f:facet>
                            <h:outputText value="#{item.validICD10ClinicalUse}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="ICD10 Primary"/>
                            </f:facet>
                            <h:outputText value="#{item.validICD10Primary}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Asterisk"/>
                            </f:facet>
                            <h:outputText value="#{item.asterisk}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Dagger"/>
                            </f:facet>
                            <h:outputText value="#{item.dagger}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Sequelae"/>
                            </f:facet>
                            <h:outputText value="#{item.sequelae}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status ADM"/>
                            </f:facet>
                            <h:outputText value="#{item.statusADM}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Start Date"/>
                            </f:facet>
                            <h:outputText value="#{item.startDate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="End Date"/>
                            </f:facet>
                            <h:outputText value="#{item.endDate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Comment"/>
                            </f:facet>
                            <h:outputText value="#{item.comment}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{diagnosisController.prepareCreate}" update=":DiagnosisCreateForm" oncomplete="PF('DiagnosisCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":DiagnosisViewForm" oncomplete="PF('DiagnosisViewDialog').show()" disabled="#{empty diagnosisController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":DiagnosisEditForm" oncomplete="PF('DiagnosisEditDialog').show()" disabled="#{empty diagnosisController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{diagnosisController.destroy}" update=":growl,datalist" disabled="#{empty diagnosisController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

        </ui:define>
    </ui:composition>

</html>
