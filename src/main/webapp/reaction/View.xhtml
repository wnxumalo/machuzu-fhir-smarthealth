<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="ReactionViewDlg" widgetVar="ReactionViewDialog" modal="true" resizable="false" appendTo="@(dialog)" header="View Reaction" styleClass="ui-fluid">
            <h:form id="ReactionViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{reactionController.selected != null}">
                        <h:outputText value="Substance"/>
                        <h:outputText value="#{reactionController.selected.substance}" title="#{bundle.ViewReactionTitle_substance}"/>
                        <h:outputText value="Manifestation"/>
                        <h:outputText value="#{reactionController.selected.manifestation}" title="#{bundle.ViewReactionTitle_manifestation}"/>
                        <h:outputText value="Description"/>
                        <h:outputText value="#{reactionController.selected.description}" title="#{bundle.ViewReactionTitle_description}"/>
                        <h:outputText value="Onset"/>
                        <h:outputText value="#{reactionController.selected.onset}" title="#{bundle.ViewReactionTitle_onset}"/>
                        <h:outputText value="Severity"/>
                        <h:outputText value="#{reactionController.selected.severity}" title="#{bundle.ViewReactionTitle_severity}"/>
                        <h:outputText value="Exposure Route"/>
                        <h:outputText value="#{reactionController.selected.exposureRoute}" title="#{bundle.ViewReactionTitle_exposureRoute}"/>
                        <h:outputText value="Note"/>
                        <h:outputText value="#{reactionController.selected.note}" title="#{bundle.ViewReactionTitle_note}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="ReactionViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
