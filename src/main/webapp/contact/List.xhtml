<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="#{bundle.ListContactTitle}"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <p:growl id="growl">
                <p:autoUpdate/>
            </p:growl>
            <h:form id="ContactListForm">
                <p:panel header="#{bundle.ListContactTitle}" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{contactController.items}" var="item"
                                 selectionMode="single" selection="#{contactController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListContactTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListContactTitle_patientId}"/>
                            </f:facet>
                            <h:outputText value="#{item.patientId}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListContactTitle_relationship}"/>
                            </f:facet>
                            <h:outputText value="#{item.relationship}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListContactTitle_gender}"/>
                            </f:facet>
                            <h:outputText value="#{item.gender}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListContactTitle_IPA}"/>
                            </f:facet>
                            <h:outputText value="#{item.IPA}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{contactController.prepareCreate}" update=":ContactCreateForm" oncomplete="PF('ContactCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":ContactViewForm" oncomplete="PF('ContactViewDialog').show()" disabled="#{empty contactController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":ContactEditForm" oncomplete="PF('ContactEditDialog').show()" disabled="#{empty contactController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{contactController.destroy}" update=":growl,datalist" disabled="#{empty contactController.selected}"/>
                        </f:facet>                        
                    </p:dataTable>
                </p:panel>

                <p:panel id="pnlUserHomeHumanName" header="Human Name" rendered="#{!empty iPAController.selected}" styleClass="ui-fluid">
                    <p:dataTable id="datalistHumanName" value="#{humanNameController.items}" var="item"
                                 selectionMode="single" selection="#{humanNameController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>
                        
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Use"/>
                            </f:facet>
                            <h:outputText value="#{item.use}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Prefix"/>
                            </f:facet>
                            <h:outputText value="#{item.prefix}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Fullname"/>
                            </f:facet>
                            <h:outputText value="#{item.text}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Other names"/>
                            </f:facet>
                            <h:outputText value="#{item.given}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Surname"/>
                            </f:facet>
                            <h:outputText value="#{item.family}"/>
                        </p:column>                                                
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Sufix"/>
                            </f:facet>
                            <h:outputText value="#{item.sufix}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Period From"/>
                            </f:facet>
                            <h:outputText value="#{item.periodFrom}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Period To"/>
                            </f:facet>
                            <h:outputText value="#{item.periodTo}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{humanNameController.prepareCreate}" update=":HumanNameCreateForm" oncomplete="PF('HumanNameCreateDialog').show()" disabled="#{!empty humanNameController.selected}"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":HumanNameViewForm" oncomplete="PF('HumanNameViewDialog').show()" disabled="#{empty humanNameController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":HumanNameEditForm" oncomplete="PF('HumanNameEditDialog').show()" disabled="#{empty humanNameController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{humanNameController.destroy}" update=":growl,datalistHumanName" disabled="#{empty humanNameController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>

                <p:panel header="Contact Point" styleClass="ui-fluid">
                    <p:dataTable id="datalistContact" value="#{contactPointController.items}" var="item"
                                 selectionMode="single" selection="#{contactPointController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>
                        
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="System"/>
                            </f:facet>
                            <h:outputText value="#{item.telecomSystem}"/>
                        </p:column>                       
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Rank"/>
                            </f:facet>
                            <h:outputText value="#{item.telecomRank}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Value"/>
                            </f:facet>
                            <h:outputText value="#{item.telecomValue}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Use"/>
                            </f:facet>
                            <h:outputText value="#{item.telecomUse}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Valid From"/>
                            </f:facet>
                            <h:outputText value="#{item.telecomPeriodFrom}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Valid To"/>
                            </f:facet>
                            <h:outputText value="#{item.telecomPeriodTo}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{contactPointController.prepareCreate}" update=":ContactPointCreateForm" oncomplete="PF('ContactPointCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":ContactPointViewForm" oncomplete="PF('ContactPointViewDialog').show()" disabled="#{empty contactPointController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":ContactPointEditForm" oncomplete="PF('ContactPointEditDialog').show()" disabled="#{empty contactPointController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{contactPointController.destroy}" update=":growl,datalistContact" disabled="#{empty contactPointController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
                
                <p:panel header="Address" styleClass="ui-fluid">
                    <p:dataTable id="datalistAddress" value="#{addressController.items}" var="item"
                                 selectionMode="single" selection="#{addressController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Use"/>
                            </f:facet>
                            <h:outputText value="#{item.use}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Type"/>
                            </f:facet>
                            <h:outputText value="#{item.type}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.text}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Further Details"/>
                            </f:facet>
                            <h:outputText value="#{item.line}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="City"/>
                            </f:facet>
                            <h:outputText value="#{item.city}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="District"/>
                            </f:facet>
                            <h:outputText value="#{item.district}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Postal Code"/>
                            </f:facet>
                            <h:outputText value="#{item.postalCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Country"/>
                            </f:facet>
                            <h:outputText value="#{item.country}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Valid From"/>
                            </f:facet>
                            <h:outputText value="#{item.periodFrom}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Valid To"/>
                            </f:facet>
                            <h:outputText value="#{item.periodTo}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{addressController.prepareCreate}" update=":AddressCreateForm" oncomplete="PF('AddressCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":AddressViewForm" oncomplete="PF('AddressViewDialog').show()" disabled="#{empty addressController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":AddressEditForm" oncomplete="PF('AddressEditDialog').show()" disabled="#{empty addressController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{addressController.destroy}" update=":growl,datalistAddress" disabled="#{empty addressController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            
            <ui:include src="/humanName/Create.xhtml"/>
            <ui:include src="/humanName/Edit.xhtml"/>
            <ui:include src="/humanName/View.xhtml"/>
            <ui:include src="/contactPoint/Create.xhtml"/>
            <ui:include src="/contactPoint/Edit.xhtml"/>
            <ui:include src="/contactPoint/View.xhtml"/>
            <ui:include src="/address/Create.xhtml"/>
            <ui:include src="/address/Edit.xhtml"/>
            <ui:include src="/address/View.xhtml"/>
            
        </ui:define>
    </ui:composition>

</html>
