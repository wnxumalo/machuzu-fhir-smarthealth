<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition>

        <p:dialog id="ContactCreateDlg" widgetVar="ContactCreateDialog" modal="true" resizable="false" appendTo="@(dialog)" header="Create Contact" styleClass="ui-fluid">
            <h:form id="ContactCreateForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{iPAController.selected != null}">                        
                        <p:outputLabel value="Relationship" for="relationship" />
                        <p:selectOneMenu id="relationship" value="#{contactController.selected.relationship}" required="true" title="Relationship">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="Emergency Contact" itemValue="C" />
                            <f:selectItem itemLabel="Employer" itemValue="E" />
                            <f:selectItem itemLabel="Federal Agency" itemValue="F" />
                            <f:selectItem itemLabel="Insurance Company" itemValue="I" />
                            <f:selectItem itemLabel="Next-of-Kin" itemValue="N" />
                            <f:selectItem itemLabel="State Agency" itemValue="S" />
                            <f:selectItem itemLabel="Unknown" itemValue="U" />
                        </p:selectOneMenu>
                        <p:outputLabel value="Gender" for="gender" />
                        <p:selectOneMenu id="gender" value="#{contactController.selected.gender}" required="true" title="Gender">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="Male" itemValue="Male" />
                            <f:selectItem itemLabel="Female" itemValue="Female" />
                            <f:selectItem itemLabel="Other" itemValue="Other" />                            
                            <f:selectItem itemLabel="Unknown" itemValue="Unknown" />                                                        
                        </p:selectOneMenu>
                    </p:panelGrid>
                    <p:commandButton actionListener="#{contactController.create(iPAController.selected.id)}" value="#{bundle.Save}" update="display,:IPAListForm:apUserHome:datalistContacts,:growl" oncomplete="handleSubmit(args,'ContactCreateDialog');"/>
                    <!--p:commandButton value="#{bundle.Cancel}" onclick="ContactCreateDialog.hide()"/-->
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>
