<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="#{bundle.ListChargeItemTitle}"></h:outputText>
        </ui:define>

        <ui:define name="content">
            
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            
            <p:growl id="growl">
                <p:autoUpdate/>
            </p:growl>

            <h3>Charge Items</h3>
            <h:form id="ChargeItemListForm">
                <p:panel id="pnlUserHome" header="Identifier" styleClass="ui-fluid">
                    <h:panelGrid columns="10" rendered="#{!empty identifierController.selected}" cellspacing="10px;" style="width:100%;" >
                        <h:outputText value="ID" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.id}"/>                    
                        <h:outputText value="USE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.use}"/>                                            
                        <h:outputText value="VALUE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.value}"/>                    
                        <h:outputText value="TYPE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.IType}"/>
                    </h:panelGrid>
                </p:panel>            

                <p:panel header="Charge Items" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{chargeItemController.items}" var="item"
                                 selectionMode="single" selection="#{chargeItemController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_accounts}"/>
                            </f:facet>
                            <h:outputText value="#{item.accounts}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_encounter}"/>
                            </f:facet>
                            <h:outputText value="#{item.encounter}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_definitionUri}"/>
                            </f:facet>
                            <h:outputText value="#{item.definitionUri}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_definitionCanonical}"/>
                            </f:facet>
                            <h:outputText value="#{item.definitionCanonical}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_CIStatus}"/>
                            </f:facet>
                            <h:outputText value="#{item.CIStatus}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_CICode}"/>
                            </f:facet>
                            <h:outputText value="#{item.CICode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_periodFrom}"/>
                            </f:facet>
                            <h:outputText value="#{item.periodFrom}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_periodTo}"/>
                            </f:facet>
                            <h:outputText value="#{item.periodTo}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_quantity}"/>
                            </f:facet>
                            <h:outputText value="#{item.quantity}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_bodySite}"/>
                            </f:facet>
                            <h:outputText value="#{item.bodySite}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_unitPriceComponent}"/>
                            </f:facet>
                            <h:outputText value="#{item.unitPriceComponent}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_totalPriceComponent}"/>
                            </f:facet>
                            <h:outputText value="#{item.totalPriceComponent}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_overridereason}"/>
                            </f:facet>
                            <h:outputText value="#{item.overridereason}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_entereddate}"/>
                            </f:facet>
                            <h:outputText value="#{item.entereddate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_reason}"/>
                            </f:facet>
                            <h:outputText value="#{item.reason}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_CIService}"/>
                            </f:facet>
                            <h:outputText value="#{item.CIService}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_product}"/>
                            </f:facet>
                            <h:outputText value="#{item.product}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListChargeItemTitle_note}"/>
                            </f:facet>
                            <h:outputText value="#{item.note}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{chargeItemController.prepareCreate}" update=":ChargeItemCreateForm" oncomplete="PF('ChargeItemCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":ChargeItemViewForm" oncomplete="PF('ChargeItemViewDialog').show()" disabled="#{empty chargeItemController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":ChargeItemEditForm" oncomplete="PF('ChargeItemEditDialog').show()" disabled="#{empty chargeItemController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{chargeItemController.destroy}" update=":growl,datalist" disabled="#{empty chargeItemController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
