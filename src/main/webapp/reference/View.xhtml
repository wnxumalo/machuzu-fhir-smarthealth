<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="ReferenceViewDlg" widgetVar="ReferenceViewDialog" modal="true" resizable="false" appendTo="@(dialog)" header="#{bundle.ViewReferenceTitle}" styleClass="ui-fluid">
            <h:form id="ReferenceViewForm">
                <h:panelGroup id="viewDisplay">
                    <p:panelGrid columns="2" rendered="#{referenceController.selected != null}">
                        <h:outputText value="#Reference"/>
                        <h:outputText value="#{referenceController.selected.objectReference}" title="#{bundle.ViewReferenceTitle_reference}"/>
                        <h:outputText value="Type"/>
                        <h:outputText value="#{referenceController.selected.type}" title="#{bundle.ViewReferenceTitle_type}"/>
                        <h:outputText value="Description"/>
                        <h:outputText value="#{referenceController.selected.description}" title="#{bundle.ViewReferenceTitle_identifier}"/>
                        <h:outputText value="Display"/>
                        <h:outputText value="#{referenceController.selected.display}" title="#{bundle.ViewReferenceTitle_display}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="ReferenceViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
