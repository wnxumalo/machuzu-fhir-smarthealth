<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="List Human Names"></h:outputText>
        </ui:define>

        <ui:define name="body">
            <p:growl id="growl">
                <p:autoUpdate/>
            </p:growl>
            <h:form id="HumanNameListForm">
                <p:panel header="Human Names" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{humanNameController.items}" var="item"
                                 selectionMode="single" selection="#{humanNameController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_use}"/>
                            </f:facet>
                            <h:outputText value="#{item.use}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_text}"/>
                            </f:facet>
                            <h:outputText value="#{item.text}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_family}"/>
                            </f:facet>
                            <h:outputText value="#{item.family}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_given}"/>
                            </f:facet>
                            <h:outputText value="#{item.given}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_prefix}"/>
                            </f:facet>
                            <h:outputText value="#{item.prefix}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_sufix}"/>
                            </f:facet>
                            <h:outputText value="#{item.sufix}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_period}"/>
                            </f:facet>
                            <h:outputText value="#{item.period}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListHumanNameTitle_IPA}"/>
                            </f:facet>
                            <h:outputText value="#{item.IPA}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{humanNameController.prepareCreate}" update=":HumanNameCreateForm" oncomplete="PF('HumanNameCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":HumanNameViewForm" oncomplete="PF('HumanNameViewDialog').show()" disabled="#{empty humanNameController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":HumanNameEditForm" oncomplete="PF('HumanNameEditDialog').show()" disabled="#{empty humanNameController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{humanNameController.destroy}" update=":growl,:IPAListForm:datalistHumanName" disabled="#{empty humanNameController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
        </ui:define>
    </ui:composition>

</html>
