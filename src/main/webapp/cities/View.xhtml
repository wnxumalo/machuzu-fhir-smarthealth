<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewCitiesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="content">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="ui-fluid">
                    <h:outputText value="#{bundle.ViewCitiesLabel_id}"/>
                    <h:outputText value="#{citiesController.selected.id}" title="#{bundle.ViewCitiesTitle_id}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_city}"/>
                    <h:outputText value="#{citiesController.selected.city}" title="#{bundle.ViewCitiesTitle_city}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_cityAscii}"/>
                    <h:outputText value="#{citiesController.selected.cityAscii}" title="#{bundle.ViewCitiesTitle_cityAscii}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_lat}"/>
                    <h:outputText value="#{citiesController.selected.lat}" title="#{bundle.ViewCitiesTitle_lat}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_lng}"/>
                    <h:outputText value="#{citiesController.selected.lng}" title="#{bundle.ViewCitiesTitle_lng}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_country}"/>
                    <h:outputText value="#{citiesController.selected.country}" title="#{bundle.ViewCitiesTitle_country}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_iso2}"/>
                    <h:outputText value="#{citiesController.selected.iso2}" title="#{bundle.ViewCitiesTitle_iso2}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_iso3}"/>
                    <h:outputText value="#{citiesController.selected.iso3}" title="#{bundle.ViewCitiesTitle_iso3}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_adminName}"/>
                    <h:outputText value="#{citiesController.selected.adminName}" title="#{bundle.ViewCitiesTitle_adminName}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_capital}"/>
                    <h:outputText value="#{citiesController.selected.capital}" title="#{bundle.ViewCitiesTitle_capital}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_population}"/>
                    <h:outputText value="#{citiesController.selected.population}" title="#{bundle.ViewCitiesTitle_population}"/>
                    <h:outputText value="#{bundle.ViewCitiesLabel_cityId}"/>
                    <h:outputText value="#{citiesController.selected.cityId}" title="#{bundle.ViewCitiesTitle_cityId}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{citiesController.destroyAndView}" value="#{bundle.ViewCitiesDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewCitiesEditLink}"/>
                <br />
                <h:commandLink action="#{citiesController.prepareCreate}" value="#{bundle.ViewCitiesCreateLink}" />
                <br />
                <h:commandLink action="#{citiesController.prepareList}" value="#{bundle.ViewCitiesShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewCitiesIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
