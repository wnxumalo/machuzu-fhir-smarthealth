<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="StatusHistoryCreateDlg" widgetVar="StatusHistoryCreateDialog" modal="true" resizable="false" appendTo="@(body)" header="#{bundle.CreateStatusHistoryTitle}">
            <h:form id="StatusHistoryCreateForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{statusHistoryController.selected != null}">
                        <p:outputLabel value="#{bundle.CreateStatusHistoryLabel_id}" for="id" />
                        <p:inputText id="id" value="#{statusHistoryController.selected.id}" title="#{bundle.CreateStatusHistoryTitle_id}" />
                        <p:outputLabel value="#{bundle.CreateStatusHistoryLabel_status}" for="status" />
                        <p:inputText id="status" value="#{statusHistoryController.selected.status}" title="#{bundle.CreateStatusHistoryTitle_status}" />
                        <p:outputLabel value="#{bundle.CreateStatusHistoryLabel_encounter}" for="encounter" />
                        <p:inputText id="encounter" value="#{statusHistoryController.selected.encounter}" title="#{bundle.CreateStatusHistoryTitle_encounter}" />
                        <p:outputLabel value="#{bundle.CreateStatusHistoryLabel_periodFrom}" for="periodFrom" />
                        <p:inputText id="periodFrom" value="#{statusHistoryController.selected.periodFrom}" title="#{bundle.CreateStatusHistoryTitle_periodFrom}" />
                        <p:outputLabel value="#{bundle.CreateStatusHistoryLabel_periodTo}" for="periodTo" />
                        <p:inputText id="periodTo" value="#{statusHistoryController.selected.periodTo}" title="#{bundle.CreateStatusHistoryTitle_periodTo}" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{statusHistoryController.create}" value="#{bundle.Save}" update="display,:StatusHistoryListForm:datalist,:growl" oncomplete="handleSubmit(args,'StatusHistoryCreateDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="StatusHistoryCreateDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
