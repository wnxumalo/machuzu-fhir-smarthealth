      xmlns:f="http://xmlns.jcp.org/jsf/core"

    <ui:composition>

                        <h:outputText value="#{bundle.ViewCodeableConceptLabel_IPA}"/>
                        <h:outputText value="#{codeableConceptController.selected.IPA}" title="#{bundle.ViewCodeableConceptTitle_IPA}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="CodeableConceptViewDialog.hide()"/>
