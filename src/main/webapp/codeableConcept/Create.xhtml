    <ui:composition>

        <p:dialog id="CodeableConceptCreateDlg" widgetVar="CodeableConceptCreateDialog" modal="true" resizable="false" appendTo="@(dialog)" header="#{bundle.CreateCodeableConceptTitle}">
            <h:form id="CodeableConceptCreateForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{codeableConceptController.selected != null}">

                        <p:inputText id="id" value="#{codeableConceptController.selected.id}" title="#{bundle.CreateCodeableConceptTitle_id}" />
                        <p:outputLabel value="#{bundle.CreateCodeableConceptLabel_coding}" for="coding" />
                        <p:inputText id="coding" value="#{codeableConceptController.selected.coding}" title="#{bundle.CreateCodeableConceptTitle_coding}" />
                        <p:outputLabel value="#{bundle.CreateCodeableConceptLabel_text}" for="text" />
                        <p:inputText id="text" value="#{codeableConceptController.selected.text}" title="#{bundle.CreateCodeableConceptTitle_text}" />
                        <p:outputLabel value="#{bundle.CreateCodeableConceptLabel_IPA}" for="IPA" />
                        <p:inputText id="IPA" value="#{codeableConceptController.selected.IPA}" title="#{bundle.CreateCodeableConceptTitle_IPA}" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{codeableConceptController.create}" value="#{bundle.Save}" update="display,:CodeableConceptListForm:apUserHome:datalist,:growl" oncomplete="handleSubmit(args,'CodeableConceptCreateDialog');"/>
