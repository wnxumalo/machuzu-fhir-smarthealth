<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="ClassHistoryViewDlg" widgetVar="ClassHistoryViewDialog" modal="true" resizable="false" appendTo="@(body)" header="#{bundle.ViewClassHistoryTitle}">
            <h:form id="ClassHistoryViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{classHistoryController.selected != null}">
                        <h:outputText value="#{bundle.ViewClassHistoryLabel_id}"/>
                        <h:outputText value="#{classHistoryController.selected.id}" title="#{bundle.ViewClassHistoryTitle_id}"/>
                        <h:outputText value="#{bundle.ViewClassHistoryLabel_coding}"/>
                        <h:outputText value="#{classHistoryController.selected.coding}" title="#{bundle.ViewClassHistoryTitle_coding}"/>
                        <h:outputText value="#{bundle.ViewClassHistoryLabel_encounter}"/>
                        <h:outputText value="#{classHistoryController.selected.encounter}" title="#{bundle.ViewClassHistoryTitle_encounter}"/>
                        <h:outputText value="#{bundle.ViewClassHistoryLabel_periodFrom}"/>
                        <h:outputText value="#{classHistoryController.selected.periodFrom}" title="#{bundle.ViewClassHistoryTitle_periodFrom}"/>
                        <h:outputText value="#{bundle.ViewClassHistoryLabel_periodTo}"/>
                        <h:outputText value="#{classHistoryController.selected.periodTo}" title="#{bundle.ViewClassHistoryTitle_periodTo}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="ClassHistoryViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
