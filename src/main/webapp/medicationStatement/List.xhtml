<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="Medication Statement"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <p:growl id="growl" showDetail="true">
                <p:autoUpdate/>
            </p:growl>

            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            
            <ui:include src="/dosage/Create-MedStatement.xhtml"/>
            <ui:include src="/dosage/Edit.xhtml"/>
            <ui:include src="/dosage/View.xhtml"/>                        

            <h3>Medication Statement</h3>

            <h:form id="MedicationStatementListForm">
                <p:panel id="pnlUserHome" header="Identifier" styleClass="ui-fluid">
                    <h:panelGrid columns="10" rendered="#{!empty identifierController.selected}" cellspacing="10px;" style="width:100%;" >
                        <h:outputText value="ID" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.id}"/>                    
                        <h:outputText value="USE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.use}"/>                                            
                        <h:outputText value="VALUE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.value}"/>                    
                        <h:outputText value="TYPE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.IType}"/>
                    </h:panelGrid>
                </p:panel>

                <p:panel header="Medication Statements" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{medicationStatementController.items}" var="item"
                                 selectionMode="single" selection="#{medicationStatementController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status"/>
                            </f:facet>
                            <h:outputText value="#{item.MStatus}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status Reason"/>
                            </f:facet>
                            <h:outputText value="#{item.statusReason}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Category"/>
                            </f:facet>
                            <h:outputText value="#{item.category}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Effective Date"/>
                            </f:facet>
                            <h:outputText value="#{item.effectiveDate}">
                                <f:convertDateTime pattern="MM/dd/yyyy" />
                            </h:outputText>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Effective Period From"/>
                            </f:facet>
                            <h:outputText value="#{item.effectivePeriodFrom}">
                                <f:convertDateTime pattern="MM/dd/yyyy" />
                            </h:outputText>
                        </p:column>                        
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Effective Period To"/>
                            </f:facet>
                            <h:outputText value="#{item.effectivePeriodTo}">
                                <f:convertDateTime pattern="MM/dd/yyyy" />
                            </h:outputText>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Date Asserted"/>
                            </f:facet>
                            <h:outputText value="#{item.dateAsserted}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Reason Code"/>
                            </f:facet>
                            <h:outputText value="#{item.reasonCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Note"/>
                            </f:facet>
                            <h:outputText value="#{item.note}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{medicationStatementController.prepareCreate}" update=":MedicationStatementCreateForm" oncomplete="PF('MedicationStatementCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" actionListener="#{medicationStatementController.initDosage}" update=":MedicationStatementViewForm" oncomplete="PF('MedicationStatementViewDialog').show()" disabled="#{empty medicationStatementController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":MedicationStatementEditForm" oncomplete="PF('MedicationStatementEditDialog').show()" disabled="#{empty medicationStatementController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{medicationStatementController.destroy}" update=":growl,datalist" disabled="#{empty medicationStatementController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>
            
        </ui:define>
    </ui:composition>

</html>
