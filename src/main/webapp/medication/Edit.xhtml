<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="MedicationEditDlg" widgetVar="MedicationEditDialog" modal="true" resizable="false" appendTo="@(dialog)" header="Edit Medication" styleClass="ui-fluid">
            <h:form id="MedicationEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{medicationController.selected != null}">
                        <p:outputLabel value="Code" for="MCode" />
                        <p:selectOneMenu id="MCode" value="#{medicationController.selected.MCode}" title="Status">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="Codeine phosphate" itemValue="261000" />
                            <f:selectItem itemLabel="Fibrinogen Tokyo II" itemValue="336001" />
                            <f:selectItem itemLabel="Fibrinogen San Juan" itemValue="363000" />
                            <f:selectItem itemLabel="Free protein S" itemValue="519005" />
                            <f:selectItem itemLabel="SP - Substance P" itemValue="585007" />
                            <f:selectItem itemLabel="Trichothecene" itemValue="693002" />
                            <f:selectItem itemLabel="Erythromycin lactobionate" itemValue="698006" />
                            <f:selectItem itemLabel="Coal tar extract" itemValue="699003" />
                        </p:selectOneMenu>
                        <p:outputLabel value="Status" for="status" />
                        <p:selectOneMenu id="status" value="#{medicationController.selected.status}" title="Status">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="active" itemValue="active" />
                            <f:selectItem itemLabel="inactive" itemValue="inactive" />
                            <f:selectItem itemLabel="entered-in-error" itemValue="entered-in-error" />                            
                        </p:selectOneMenu>
                        <p:outputLabel value="Form" for="form" />
                        <p:selectOneMenu id="form" value="#{medicationController.selected.form}" title="Form">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="powder" itemValue="powder" />
                            <f:selectItem itemLabel="tablets" itemValue="tablets" />
                            <f:selectItem itemLabel="capsule" itemValue="capsule" />                            
                        </p:selectOneMenu>
                        <p:outputLabel value="Amount" for="amount" />
                        <p:inputText id="amount" value="#{medicationController.selected.amount}" title="Amount" />
                        <p:outputLabel value="Batch Lot Number" for="batchLotNumber" />
                        <p:inputText id="batchLotNumber" value="#{medicationController.selected.batchLotNumber}" title="Batch Lot Number" />
                        <p:outputLabel value="Batch Expiration Date" for="batchExpirationDate" />
                        <p:calendar id="batchExpirationDate" value="#{medicationController.selected.batchExpirationDate}" maxdate="#{iPAController.currentDate}" yearRange="c-100:c+100" mode="popup" pattern="yyyy/MM/dd" navigator="true" required="true" style="width:100%" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{medicationController.update}" value="#{bundle.Save}" update="display,:growl" oncomplete="handleSubmit(args, 'MedicationEditDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="MedicationEditDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
