<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="MedicationViewDlg" widgetVar="MedicationViewDialog" modal="true" resizable="false" appendTo="@(content)" header="#{bundle.ViewMedicationTitle}" styleClass="ui-fluid">
            <h:form id="MedicationViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{medicationController.selected != null}">
                        <h:outputText value="#{bundle.ViewMedicationLabel_id}"/>
                        <h:outputText value="#{medicationController.selected.id}" title="#{bundle.ViewMedicationTitle_id}"/>
                        <h:outputText value="#{bundle.ViewMedicationLabel_medicationRequest}"/>
                        <h:outputText value="#{medicationController.selected.medicationRequest}" title="#{bundle.ViewMedicationTitle_medicationRequest}"/>
                        <h:outputText value="#{bundle.ViewMedicationLabel_MCode}"/>
                        <h:outputText value="#{medicationController.selected.MCode}" title="#{bundle.ViewMedicationTitle_MCode}"/>
                        <h:outputText value="#{bundle.ViewMedicationLabel_status}"/>
                        <h:outputText value="#{medicationController.selected.status}" title="#{bundle.ViewMedicationTitle_status}"/>
                        <h:outputText value="#{bundle.ViewMedicationLabel_form}"/>
                        <h:outputText value="#{medicationController.selected.form}" title="#{bundle.ViewMedicationTitle_form}"/>
                        <h:outputText value="#{bundle.ViewMedicationLabel_amount}"/>
                        <h:outputText value="#{medicationController.selected.amount}" title="#{bundle.ViewMedicationTitle_amount}"/>
                        <h:outputText value="#{bundle.ViewMedicationLabel_batchLotNumber}"/>
                        <h:outputText value="#{medicationController.selected.batchLotNumber}" title="#{bundle.ViewMedicationTitle_batchLotNumber}"/>
                        <h:outputText value="#{bundle.ViewMedicationLabel_batchExpirationDate}"/>
                        <h:outputText value="#{medicationController.selected.batchExpirationDate}" title="#{bundle.ViewMedicationTitle_batchExpirationDate}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="MedicationViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
