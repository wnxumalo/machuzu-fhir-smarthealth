<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="AddressViewDlg" widgetVar="AddressViewDialog" modal="true" resizable="false" appendTo="@(dialog)" header="View Address" styleClass="ui-fluid">
            <h:form id="AddressViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{addressController.selected != null}">
                        <h:outputText value="Use"/>
                        <h:outputText value="#{addressController.selected.use}" title="#{bundle.ViewAddressTitle_use}"/>
                        <h:outputText value="Type"/>
                        <h:outputText value="#{addressController.selected.type}" title="#{bundle.ViewAddressTitle_type}"/>
                        <h:outputText value="Text"/>
                        <h:outputText value="#{addressController.selected.text}" title="#{bundle.ViewAddressTitle_text}"/>
                        <h:outputText value="Line"/>
                        <h:outputText value="#{addressController.selected.line}" title="#{bundle.ViewAddressTitle_line}"/>
                        <h:outputText value="City"/>
                        <h:outputText value="#{addressController.selected.city}" title="#{bundle.ViewAddressTitle_city}"/>
                        <h:outputText value="District"/>
                        <h:outputText value="#{addressController.selected.district}" title="#{bundle.ViewAddressTitle_district}"/>                        
                        <h:outputText value="Postal Code"/>
                        <h:outputText value="#{addressController.selected.postalCode}" title="#{bundle.ViewAddressTitle_postalCode}"/>
                        <h:outputText value="Country"/>
                        <h:outputText value="#{addressController.selected.country}" title="#{bundle.ViewAddressTitle_country}"/>
                        <h:outputText value="Valid From"/>
                        <h:outputText value="#{addressController.selected.periodFrom}" title="#{bundle.ViewAddressTitle_period}"/>
                        <h:outputText value="Valid To"/>
                        <h:outputText value="#{addressController.selected.periodTo}" title="#{bundle.ViewAddressTitle_period}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="AddressViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
