<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition>

        <p:dialog id="AddressEditDlg" widgetVar="AddressEditDialog" modal="true" resizable="false" appendTo="@(dialog)" header="Edit Address" styleClass="ui-fluid">
            <h:form id="AddressEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{addressController.selected != null}">
                        <p:outputLabel value="Use" for="use" />
                        <p:selectOneMenu id="use" value="#{addressController.selected.use}" required="true" title="Use">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="home" itemValue="home" />
                            <f:selectItem itemLabel="work" itemValue="work" />
                            <f:selectItem itemLabel="temp" itemValue="temp" />
                            <f:selectItem itemLabel="old" itemValue="old" />
                            <f:selectItem itemLabel="billing" itemValue="billing" />
                        </p:selectOneMenu>
                        <p:outputLabel value="Type" for="type" />
                        <p:selectOneMenu id="type" value="#{addressController.selected.use}" required="true" title="Type">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="postal" itemValue="postal" />
                            <f:selectItem itemLabel="physical" itemValue="physical" />
                            <f:selectItem itemLabel="both" itemValue="both" />
                        </p:selectOneMenu>
                        <p:outputLabel value="Details" for="text" />
                        <p:inputTextarea id="text" value="#{addressController.selected.text}" title="#{bundle.CreateAddressTitle_text}" style="width: 100%" />
                        <p:outputLabel value="Further Details" for="line" />
                        <p:inputTextarea id="line" value="#{addressController.selected.line}" title="#{bundle.CreateAddressTitle_line}" style="width: 100%" />
                        <p:outputLabel value="Country" for="country" />
                        <h:selectOneMenu id='country' value="#{addressController.selected.country}" title="Country">
                            <f:selectItems value="#{citiesController.countries}" var="cnty" itemValue="#{cnty}" itemLabel="#{cnty}"/>
                             <p:ajax listener="#{citiesController.onCountryChange(addressController.selected.country)}" update="city"/>
                        </h:selectOneMenu>                            
                        <p:outputLabel value="District" for="district" />
                        <p:inputText id="district" value="#{addressController.selected.district}" title="#{bundle.CreateAddressTitle_country}" />
                        <p:outputLabel value="City" for="city" />
                        <h:selectOneMenu id='city' value="#{addressController.selected.city}" title="City" >
                            <f:selectItems id="cities" value="#{citiesController.citiesList}" var="cty" itemValue="#{cty}" itemLabel="#{cty}"/>
                        </h:selectOneMenu>                            
                        <p:outputLabel value="Postal Code" for="postalCode" />
                        <p:inputText id="postalCode" value="#{addressController.selected.postalCode}" title="#{bundle.CreateAddressTitle_postalCode}" />                        
                        <p:outputLabel value="Valid From" for="periodFrom" />
                        <p:calendar id="periodFrom" value="#{addressController.selected.periodFrom}" yearRange="c-100:c+100" mode="popup" pattern="yyyy/MM/dd" navigator="true" style="width:100%" />                        
                        <p:outputLabel value="Valid To" for="periodTo" />
                        <p:calendar id="periodTo" value="#{addressController.selected.periodTo}" yearRange="c-100:c+100" mode="popup" pattern="yyyy/MM/dd" navigator="true" style="width:100%" />                        
                    </p:panelGrid>
                    <p:commandButton actionListener="#{addressController.update}" value="#{bundle.Save}" update="display,:IPAListForm:apUserHome:datalistAddress,:growl" oncomplete="handleSubmit(args, 'AddressEditDialog');"/>
                    <!--p:commandButton value="#{bundle.Cancel}" onclick="AddressEditDialog.hide()"/-->
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
