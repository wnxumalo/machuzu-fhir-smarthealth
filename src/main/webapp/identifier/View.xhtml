<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="IdentifierViewDlg" widgetVar="IdentifierViewDialog" modal="true" resizable="false" appendTo="@(dialog)" 
                  header="#{bundle.ViewIdentifierTitle}" styleClass="ui-fluid" >
            <h:form id="IdentifierViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{identifierController.selected != null}">
                        <h:outputText value="Use"/>
                        <h:outputText value="#{identifierController.selected.use}" title="#{bundle.ViewIdentifierTitle_use}"/>
                        <h:outputText value="Type"/>
                        <h:outputText value="#{identifierController.selected.IType}" title="#{bundle.ViewIdentifierTitle_type}"/>
                        <h:outputText value="System"/>
                        <h:outputText value="#{identifierController.selected.system}" title="#{bundle.ViewIdentifierTitle_system}"/>
                        <h:outputText value="Value"/>
                        <h:outputText value="#{identifierController.selected.value}" title="#{bundle.ViewIdentifierTitle_value}"/>
                        <h:outputText value="Valid From"/>
                        <h:outputText value="#{identifierController.selected.periodFrom}" title="#{bundle.ViewIdentifierTitle_period}"/>
                        <h:outputText value="Valid To"/>
                        <h:outputText value="#{identifierController.selected.periodTo}" title="#{bundle.ViewIdentifierTitle_period}"/>
                        <h:outputText value="Assigner"/>
                        <h:outputText value="#{identifierController.selected.objectReference}" title="#{bundle.ViewIdentifierTitle_assigner}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="IdentifierViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
