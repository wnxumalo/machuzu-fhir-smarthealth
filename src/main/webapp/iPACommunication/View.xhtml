<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="IPACommunicationViewDlg" widgetVar="IPACommunicationViewDialog" modal="true" resizable="false" appendTo="@(dialog)" header="#{bundle.ViewIPACommunicationTitle}">
            <h:form id="IPACommunicationViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{iPACommunicationController.selected != null}">
                        <h:outputText value="#{bundle.ViewIPACommunicationLabel_id}"/>
                        <h:outputText value="#{iPACommunicationController.selected.id}" title="#{bundle.ViewIPACommunicationTitle_id}"/>
                        <h:outputText value="#{bundle.ViewIPACommunicationLabel_patientId}"/>
                        <h:outputText value="#{iPACommunicationController.selected.patientId}" title="#{bundle.ViewIPACommunicationTitle_patientId}"/>
                        <h:outputText value="#{bundle.ViewIPACommunicationLabel_preferred}"/>
                        <h:outputText value="#{iPACommunicationController.selected.preferred}" title="#{bundle.ViewIPACommunicationTitle_preferred}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="IPACommunicationViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
