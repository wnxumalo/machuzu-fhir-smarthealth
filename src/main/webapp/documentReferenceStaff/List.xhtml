<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/staffTemplate.xhtml">


        <ui:define name="title">
            <h:outputText value="Document Reference"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            <ui:include src="Upload.xhtml"/>

            <p:growl id="growl" showDetail="true">
                <p:autoUpdate/>
            </p:growl>

            <h3>Document Reference</h3>
            <h:form id="DocumentReferenceListForm">
                <p:panel id="pnlUserHome" header="Identifier" styleClass="ui-fluid">
                    <h:panelGrid columns="10" rendered="#{!empty identifierController.selected}" cellspacing="10px;" style="width:100%;" >
                        <h:outputText value="ID" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.id}"/>                    
                        <h:outputText value="USE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.use}"/>                                            
                        <h:outputText value="VALUE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.value}"/>                    
                        <h:outputText value="TYPE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.IType}"/>
                    </h:panelGrid>
                </p:panel>

                <p:panel header="Document Reference" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{documentReferenceController.items}" var="item"
                                 selectionMode="single" selection="#{documentReferenceController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status"/>
                            </f:facet>
                            <h:outputText value="#{item.DRStatus}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Document Status"/>
                            </f:facet>
                            <h:outputText value="#{item.docStatus}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Type"/>
                            </f:facet>
                            <h:outputText value="#{item.DRType}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Category"/>
                            </f:facet>
                            <h:outputText value="#{item.category}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Date"/>
                            </f:facet>
                            <h:outputText value="#{item.DRDate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Security Label"/>
                            </f:facet>
                            <h:outputText value="#{item.securityLabel}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Content Attachment"/>
                            </f:facet>
                            <h:outputText value="#{item.contentAttachment}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Content Format"/>
                            </f:facet>
                            <h:outputText value="#{item.contentFormat}"/>
                        </p:column>                        
                        <f:facet name="footer">                            
                            <p:commandButton id="createButton"   icon="ui-icon-plus" value="Create" actionListener="#{documentReferenceController.prepareCreate()}" update=":DocumentReferenceCreateForm" oncomplete="PF('DocumentReferenceCreateDialog').show()" disabled="#{!empty documentReferenceController.selected}"/>                                
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":DocumentReferenceViewForm" oncomplete="PF('DocumentReferenceViewDialog').show()" disabled="#{empty documentReferenceController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":DocumentReferenceEditForm" oncomplete="PF('DocumentReferenceEditDialog').show()" disabled="#{empty documentReferenceController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{documentReferenceController.destroy}" update=":growl,datalist" disabled="#{empty documentReferenceController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>

            </h:form>

        </ui:define>
    </ui:composition>

</html>
