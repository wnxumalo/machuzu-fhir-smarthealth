<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="DocumentReferenceUploadDlg" widgetVar="DocumentReferenceUploadDialog" modal="true" resizable="false" appendTo="@(dialog)" header="Upload Document" style="width: 100%;" styleClass="ui-fluid">
            
            <h:form id="DocumentReferenceUploadForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2">
                        <p:fileUpload id="uploadButton" listener="#{documentReferenceController.handleFileUpload}" mode="advanced" dragDropSupport="false"
                                      sizeLimit="1048576" fileLimit="3" oncomplete="handleSubmit(args,'DocumentReferenceUploadDialog');" ></p:fileUpload>

                    </p:panelGrid>                                       
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
