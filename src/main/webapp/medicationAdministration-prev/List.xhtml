<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="#{bundle.ListMedicationAdministrationTitle}"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
                
            <p:growl id="growl">
                <p:autoUpdate/>
            </p:growl>
            
            <h3>Medication Administration</h3>

            <h:form id="MedicationAdministrationListForm">
                <p:panel header="#{bundle.ListMedicationAdministrationTitle}">
                    <p:dataTable id="datalist" value="#{medicationAdministrationController.items}" var="item"
                                 selectionMode="single" selection="#{medicationAdministrationController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>
                        
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_intent}"/>
                            </f:facet>
                            <h:outputText value="#{item.intent}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_category}"/>
                            </f:facet>
                            <h:outputText value="#{item.category}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_title}"/>
                            </f:facet>
                            <h:outputText value="#{item.title}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_description}"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_status}"/>
                            </f:facet>
                            <h:outputText value="#{item.status}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_periodFrom}"/>
                            </f:facet>
                            <h:outputText value="#{item.periodFrom}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_periodTo}"/>
                            </f:facet>
                            <h:outputText value="#{item.periodTo}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_reasonCode}"/>
                            </f:facet>
                            <h:outputText value="#{item.reasonCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_note}"/>
                            </f:facet>
                            <h:outputText value="#{item.note}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListMedicationAdministrationTitle_dosage}"/>
                            </f:facet>
                            <h:outputText value="#{item.dosage}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{medicationAdministrationController.prepareCreate}" update=":MedicationAdministrationCreateForm" oncomplete="PF('MedicationAdministrationCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":MedicationAdministrationViewForm" oncomplete="PF('MedicationAdministrationViewDialog').show()" disabled="#{empty medicationAdministrationController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":MedicationAdministrationEditForm" oncomplete="PF('MedicationAdministrationEditDialog').show()" disabled="#{empty medicationAdministrationController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{medicationAdministrationController.destroy}" update=":growl,datalist" disabled="#{empty medicationAdministrationController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

        </ui:define>
    </ui:composition>

</html>
