<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/adminTemplate.xhtml">

        <ui:define name="title">
            <h:outputText value="International Patient Access (IPA)"></h:outputText>
        </ui:define>

        <ui:define name="dialog"></ui:define>

        <ui:define name="content">
            <p:growl id="growl" showDetail="true">
                <p:autoUpdate/>
            </p:growl>
            <h:form id="IPAListForm">
                <p:panel header="Facility Users" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{iPAController.items}" var="item"
                                 selectionMode="single" selection="#{iPAController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>
                        
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Unique Id"/>
                            </f:facet>
                            <h:outputText value="#{item.UUID}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Email"/>
                            </f:facet>
                            <h:outputText value="#{item.email}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Gender"/>
                            </f:facet>
                            <h:outputText value="#{item.gender}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Birth Date"/>
                            </f:facet>
                            <h:outputText value="#{item.birthDate}"/>
                        </p:column>                        
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Marital Status"/>
                            </f:facet>
                            <h:outputText value="#{item.maritalStatus}"/>
                        </p:column>                        
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{iPAController.prepareCreate}" update=":IPACreateForm" oncomplete="PF('IPACreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":IPAViewForm" oncomplete="PF('IPAViewDialog').show()" disabled="#{empty iPAController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":IPAEditForm" oncomplete="PF('IPAEditDialog').show()" disabled="#{empty iPAController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{iPAController.destroy}" update=":growl" disabled="#{empty iPAController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
        </ui:define>
    </ui:composition>
</html>
