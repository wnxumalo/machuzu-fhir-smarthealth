<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">

        <ui:define name="title">
            <h:outputText value="International Patient Access (IPA)"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <p:growl id="growl" showDetail="true">
                <p:autoUpdate/>
            </p:growl>
            <h:form id="IPAListForm1">
                <p:panel header="International Patient Access (IPA) - Login" styleClass="ui-fluid">
                    <p:panelGrid columns="2">
                        <p:outputLabel value="Email" for="email" />
                        <p:inputText id="email" value="#{iPAController.selected.email}" title="Unique ID" required="true" />
                        <p:outputLabel value="Password" for="password" />
                        <p:inputText id="password" value="#{iPAController.selected.password}" title="Email" required="true" />
                        <p:commandButton action="#{iPAController.login(session)}" value="Login" update="growl" />
                    </p:panelGrid>
                </p:panel>
            </h:form>

        </ui:define>
    </ui:composition>
</html>
