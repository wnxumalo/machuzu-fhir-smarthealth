<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/staffTemplate.xhtml">

        <ui:define name="title">
            <h:outputText value="International Patient Access (IPA)"></h:outputText>
        </ui:define>

        <ui:define name="dialog"></ui:define>

        <ui:define name="content">
            <p:growl id="growl" showDetail="true" showSummary="true">
                <p:autoUpdate/>
            </p:growl>

            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>  
            
            <ui:include src="/identifier/Create.xhtml"/>
            <ui:include src="/identifier/Edit.xhtml"/>
            <ui:include src="/identifier/View.xhtml"/>
                        
            <ui:include src="/humanName/Create.xhtml"/>
            <ui:include src="/humanName/Edit.xhtml"/>
            <ui:include src="/humanName/View.xhtml"/>

            <ui:include src="/reference/Create.xhtml"/>
            <ui:include src="/reference/Edit.xhtml"/>
            <ui:include src="/reference/View.xhtml"/>

            <h:form id="IPAListForm"> 

                <center>
                    <p:panel id="pnlIPAMain" header="International Patient Access Record" styleClass="ui-fluid">                            
                        <h:outputText value="Search" style="font-weight: bold;"/>
                        <h:inputText value="#{iPAController.findPatient}" />&nbsp;&nbsp;&nbsp;&nbsp;                            
                        <p:commandButton id="searchButton" icon="ui-icon-search" value="Search" actionListener="#{iPAController.searchPatient}" update=":IPAViewForm:display,:IPAListForm:pnlUserHome,:growl,:IPAListForm:apUserHome:identifierDatalist,:IPAListForm:apUserHome:datalistHumanName"/>
                        <p:commandButton id="createButtonPatient" icon="ui-icon-plus" value="Create" actionListener="#{iPAController.prepareCreate}" update="" oncomplete="PF('IPACreateDialog').show()"/>                        
                    </p:panel>
                    <h:panelGrid columns="2" style="width:100%;" styleClass="ui-fluid">                
                        <p:commandButton id="btnEncounters" value="Encounters" update=":growl" action="/encounter/List" style="width: 100%; height: 100%; color: cornflowerblue;" disabled="#{empty identifierController.selected}" />
                        <p:commandButton value="Financial" update=":growl" action="#{accountController.listAccounts(empty identifierController.selected)}" style="width: 100%; height: 100%; color: crimson;" disabled="#{empty encounterController.selected}" />
                    </h:panelGrid>
                    <p:panel id="pnlUserHome" styleClass="ui-fluid">
                        <p:outputLabel value="No Patient Selected or Record is Inactive" rendered="#{!iPAController.selected.active}" style="color: crimson;" />
                        <h:panelGrid columns="10" cellspacing="10px;" style="width:100%;" rendered="#{iPAController.selected.active}" >
                            <h:outputText value="UID" style="font-weight: bold;"/>
                            <h:outputText value="#{iPAController.selected.UUID}"/>                    
                            <h:outputText value="ACTIVE" style="font-weight: bold;"/>
                            <h:outputText value="#{iPAController.selected.active}"/>                                            
                            <h:outputText value="EMAIL" style="font-weight: bold;"/>
                            <h:outputText value="#{iPAController.selected.email}"/>                    
                            <h:outputText value="GENDER" style="font-weight: bold;"/>
                            <h:outputText value="#{iPAController.selected.gender}"/>
                            <h:outputText value="BIRTH DATE" style="font-weight: bold;"/>
                            <h:outputText value="#{iPAController.selected.birthDate}"/>                        
                        </h:panelGrid>                    
                    </p:panel>
                
                    <h:panelGrid columns="10" style="width:100%;" styleClass="ui-fluid">                    
                        <p:commandButton value="Vitals" update=":growl" action="/vitals/List" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />
                        <p:commandButton value="Allergy" update=":growl" action="#{allergyController.listAllergies(empty identifierController.selected)}" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />
                        <p:commandButton value="Condition" update=":growl" action="#{conditionController.listConditions(empty identifierController.selected)}" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />                                                
                        <p:commandButton value="Procedure" update=":growl" action="/procedure/List" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />                                                
                        <p:commandButton value="Diagnosis" update=":growl" action="/observationDiagnosis/List" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />
                        <p:commandButton value="Medication" update=":growl" action="/medicationAdministration/List" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />
                        <p:commandButton value="Lab" update=":growl" action="/lab/List" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />
                        <p:commandButton value="Observation" update=":growl" action="#{observationController.listObservations(empty identifierController.selected)}" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />                        
                        <p:commandButton value="Immunisation" update=":growl" action="#{immunisationController.listImmunisations(empty identifierController.selected)}" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />
                        <p:commandButton value="Document Reference" update=":growl" action="#{documentReferenceController.listDocuments(empty identifierController.selected)}" style="width: 100%; height: 100%; color: darkgreen;" disabled="#{empty encounterController.selected}" />                        
                    </h:panelGrid>                    
                    <br/>                
                </center>
                    <p:accordionPanel multiple="true" widgetVar="options" id="apUserHome" styleClass="ui-fluid">
                    <p:tab title="IDENTIFIERS">

                        <f:facet name="options">
                            <p:menu>
                                <p:submenu label="Options">
                                    <p:menuitem value="Select all" url="#" icon="pi pi-clone" onclick="PF('options').selectAll()" />
                                    <p:menuitem value="Unselect all" url="#" icon="pi pi-times" onclick="PF('options').unselectAll()" />
                                </p:submenu>
                            </p:menu>
                        </f:facet>
                        <p class="m-0">

                            <p:dataTable id="identifierDatalist" value="#{iPAController.selected.identifier}" var="item"
                                         selectionMode="single" selection="#{identifierController.selected}"
                                         paginator="true"
                                         rowKey="#{item.id}"
                                         rows="10"
                                         rowsPerPageTemplate="10,20,30,40,50"
                                         >

                                <p:ajax event="rowSelect" update="createIdentityButton viewIdentityButton editIdentityButton deleteIdentityButton :IPAListForm:btnEncounters"/>
                                <p:ajax event="rowUnselect" update="createIdentityButton viewIdentityButton editIdentityButton deleteIdentityButton :IPAListForm:btnEncounters"/>

                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Id"/>
                                    </f:facet>
                                    <h:outputText value="#{item.id}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Use"/>
                                    </f:facet>
                                    <h:outputText value="#{item.use}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Type"/>
                                    </f:facet>
                                    <h:outputText value="#{item.IType}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="System"/>
                                    </f:facet>
                                    <h:outputText value="#{item.system}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Value"/>
                                    </f:facet>
                                    <h:outputText value="#{item.value}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Period From"/>
                                    </f:facet>
                                    <h:outputText value="#{item.periodFrom}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Period To"/>
                                    </f:facet>
                                    <h:outputText value="#{item.periodTo}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Assigner"/>
                                    </f:facet>
                                    <h:outputText value="#{item.objectReference.description}"/>
                                </p:column>
                                <f:facet name="footer">
                                    <p:commandButton id="createIdentityButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{identifierController.prepareCreate}" update=":IdentifierCreateForm" oncomplete="PF('IdentifierCreateDialog').show()" disabled="#{!empty identifierController.selected}"/>
                                    <p:commandButton id="viewIdentityButton"   icon="ui-icon-search" value="#{bundle.View}" update=":IdentifierViewForm" oncomplete="PF('IdentifierViewDialog').show()" disabled="#{empty identifierController.selected}"/>
                                    <p:commandButton id="editIdentityButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":IdentifierEditForm" oncomplete="PF('IdentifierEditDialog').show()" disabled="#{empty identifierController.selected}"/>
                                    <p:commandButton id="deleteIdentityButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{identifierController.destroy}" update=":growl,:IPAListForm:apUserHome:identifierDatalist" disabled="#{empty identifierController.selected}"/>                        
                                    <p:commandButton id="createButton" icon="ui-icon-plus" value="New Assigner" actionListener="#{referenceController.prepareCreate}" update=":ReferenceCreateForm" oncomplete="PF('ReferenceCreateDialog').show()" style="width: 100%; height: 100%; background-color: cornflowerblue"/>
                                </f:facet>
                            </p:dataTable>                    

                        </p>
                    </p:tab>
                    <p:tab title="HUMAN NAME">
                        <f:facet name="actions">
                            <p:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default">
                                <h:outputText styleClass="ui-icon pi pi-question" />
                            </p:commandLink>
                            <p:commandLink styleClass="ui-panel-titlebar-icon ui-corner-all ui-state-default">
                                <h:outputText styleClass="ui-icon pi pi-star" />
                            </p:commandLink>
                        </f:facet>
                        <p class="m-0">                    
                            <p:dataTable id="datalistHumanName" value="#{iPAController.selected.humanName}" var="item"
                                         selectionMode="single" selection="#{humanNameController.selected}"
                                         paginator="true"
                                         rowKey="#{item.id}"
                                         rows="10"
                                         rowsPerPageTemplate="10,20,30,40,50"
                                         rendered="#{!empty iPAController.selected}"
                                         >

                                <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                                <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Use"/>
                                    </f:facet>
                                    <h:outputText value="#{item.use}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Prefix"/>
                                    </f:facet>
                                    <h:outputText value="#{item.prefix}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Fullname"/>
                                    </f:facet>
                                    <h:outputText value="#{item.text}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Other names"/>
                                    </f:facet>
                                    <h:outputText value="#{item.given}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Surname"/>
                                    </f:facet>
                                    <h:outputText value="#{item.family}"/>
                                </p:column>                                                
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Sufix"/>
                                    </f:facet>
                                    <h:outputText value="#{item.sufix}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Period From"/>
                                    </f:facet>
                                    <h:outputText value="#{item.periodFrom}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">
                                        <h:outputText value="Period To"/>
                                    </f:facet>
                                    <h:outputText value="#{item.periodTo}"/>
                                </p:column>
                                <f:facet name="footer">
                                    <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{humanNameController.prepareCreate}" update=":HumanNameCreateForm" oncomplete="PF('HumanNameCreateDialog').show()" disabled="#{!empty humanNameController.selected}"/>
                                    <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":HumanNameViewForm" oncomplete="PF('HumanNameViewDialog').show()" disabled="#{empty humanNameController.selected}"/>
                                    <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":HumanNameEditForm" oncomplete="PF('HumanNameEditDialog').show()" disabled="#{empty humanNameController.selected}"/>
                                    <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{humanNameController.destroy}" update=":growl,:IPAListForm:apUserHome:datalistHumanName" disabled="#{empty humanNameController.selected}"/>
                                </f:facet>
                            </p:dataTable>
                        </p>
                    </p:tab>
                    
                    
                </p:accordionPanel>

            </h:form>            
        </ui:define>
    </ui:composition>

</html>
