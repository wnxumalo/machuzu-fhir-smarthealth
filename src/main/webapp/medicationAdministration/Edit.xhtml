<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="MedicationAdministrationEditDlg" widgetVar="MedicationAdministrationEditDialog" modal="true" resizable="false" appendTo="@(dialog)" header="#{bundle.EditMedicationAdministrationTitle}" styleClass="ui-fluid">
            <h:form id="MedicationAdministrationEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{medicationAdministrationController.selected != null}">
                        <p:outputLabel value="#{bundle.CreateMedicationAdministrationLabel_intent}" for="status" />
                        <p:selectOneMenu id="status" value="#{medicationAdministrationController.selected.status}" required="true" title="Status">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="In Progress" itemValue="in-progress" />
                            <f:selectItem itemLabel="Not Done" itemValue="not-done" />
                            <f:selectItem itemLabel="On Hold" itemValue="on-hold" />                            
                            <f:selectItem itemLabel="Completed" itemValue="completed" />
                            <f:selectItem itemLabel="Entered In Error" itemValue="entered-in-error" />
                            <f:selectItem itemLabel="Stopped" itemValue="stopped" />
                            <f:selectItem itemLabel="Unknown" itemValue="unknown" />                            
                        </p:selectOneMenu>
                        <p:outputLabel value="Status Reason" for="statusreason" />
                        <p:selectOneMenu id="statusreason" value="#{medicationAdministrationController.selected.status}" required="true" title="Status">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="In Progress" itemValue="in-progress" />
                            <f:selectItem itemLabel="Not Done" itemValue="not-done" />
                            <f:selectItem itemLabel="On Hold" itemValue="on-hold" />                            
                            <f:selectItem itemLabel="Completed" itemValue="completed" />
                            <f:selectItem itemLabel="Entered In Error" itemValue="entered-in-error" />
                            <f:selectItem itemLabel="Stopped" itemValue="stopped" />
                            <f:selectItem itemLabel="Unknown" itemValue="unknown" />                            
                        </p:selectOneMenu>
                        <p:outputLabel value="#{bundle.CreateMedicationAdministrationLabel_category}" for="category" />
                        <p:selectOneMenu id="category" value="#{medicationAdministrationController.selected.category}" required="true" title="Status">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="Inpatient" itemValue="inpatient" />
                            <f:selectItem itemLabel="Outpatient" itemValue="outpatient" />
                            <f:selectItem itemLabel="Community" itemValue="community" />                            
                        </p:selectOneMenu>                        
                        <p:outputLabel value="#{bundle.CreateMedicationAdministrationLabel_title}" for="title" />
                        <p:inputText id="title" value="#{medicationAdministrationController.selected.title}" title="#{bundle.CreateMedicationAdministrationTitle_title}" />
                        <p:outputLabel value="#{bundle.CreateMedicationAdministrationLabel_description}" for="description" />
                        <p:inputText id="description" value="#{medicationAdministrationController.selected.description}" title="#{bundle.CreateMedicationAdministrationTitle_description}" />
                        <p:outputLabel value="#{bundle.CreateMedicationAdministrationLabel_periodFrom}" for="periodFrom" />
                        <p:calendar id="periodFrom" value="#{medicationAdministrationController.selected.periodFrom}" mode="popup" pattern="yyyy/MM/dd" navigator="true" style="width:100%" title="Period From" />
                        <p:outputLabel value="periodTo" for="periodTo" />
                        <p:calendar id="periodTo" value="#{medicationAdministrationController.selected.periodTo}" mode="popup" pattern="yyyy/MM/dd" navigator="true" style="width:100%" title="Period To" />
                        <p:outputLabel value="#{bundle.CreateMedicationAdministrationLabel_reasonCode}" for="reasonCode" />
                        <p:selectOneMenu id="reasonCode" value="#{medicationAdministrationController.selected.category}" required="true" title="Status">
                            <f:selectItem itemLabel="Select" itemValue="" />
                            <f:selectItem itemLabel="None" itemValue="a" />
                            <f:selectItem itemLabel="Given As Ordered" itemValue="b" />
                            <f:selectItem itemLabel="Emergency" itemValue="c" />                            
                        </p:selectOneMenu>                        
                        <p:outputLabel value="#{bundle.CreateMedicationAdministrationLabel_note}" for="note" />
                        <p:inputText id="note" value="#{medicationAdministrationController.selected.note}" title="#{bundle.CreateMedicationAdministrationTitle_note}" />                        
                    </p:panelGrid>
                    <p:commandButton actionListener="#{medicationAdministrationController.update}" value="#{bundle.Save}" update="display,:MedicationAdministrationListForm:datalist,:growl" oncomplete="handleSubmit(args, 'MedicationAdministrationEditDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="MedicationAdministrationEditDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
