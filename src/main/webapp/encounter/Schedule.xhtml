                            <p:ajax event="eventSelect" listener="#{encounterController.onEventSelect}" update="eventDetails" oncomplete="PF('eventDialog').show();" />
                            <p:ajax event="eventMove" listener="#{encounterController.onEventMove}" update="growl" />
                            <p:ajax event="eventResize" listener="#{encounterController.onEventResize}" update="growl" />

                        </p:schedule>
                    </h:panelGrid>
