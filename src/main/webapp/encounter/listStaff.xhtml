<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/staffTemplate.xhtml">

        <ui:define name="title">
            <h:outputText value="Encounters"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            
            <p:growl id="growl" showDetail="true" showSummary="true">
                <p:autoUpdate/>
            </p:growl>
            <h3>International Patient Access (IPA)</h3>            
            <h:form id="EncounterListForm">
                <p:panel header="Encounters" styleClass="ui-fluid">
                    <p:dataTable id="datalistEncounters" value="#{iPAController.selected.encounters}" var="item"
                                 selectionMode="single" selection="#{encounterController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status"/>
                            </f:facet>
                            <h:outputText value="#{item.status}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Class"/>
                            </f:facet>
                            <h:outputText value="#{item.EClass}"/>
                        </p:column>                        
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Service Type"/>
                            </f:facet>
                            <h:outputText value="#{item.serviceType}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Priority"/>
                            </f:facet>
                            <h:outputText value="#{item.priority}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Valid From"/>
                            </f:facet>
                            <h:outputText value="#{item.periodFrom}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Valid To"/>
                            </f:facet>
                            <h:outputText value="#{item.periodTo}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Reason"/>
                            </f:facet>
                            <h:outputText value="#{item.reasonCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Title"/>
                            </f:facet>
                            <h:outputText value="#{item.eventTitle}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.eventDescription}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Use"/>
                            </f:facet>
                            <h:outputText value="#{item.diagnosisUse}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Rank"/>
                            </f:facet>
                            <h:outputText value="#{item.diagnosisRank}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Admition Source"/>
                            </f:facet>
                            <h:outputText value="#{item.admitSource}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="Create" actionListener="#{encounterController.prepareCreate}" update=":EncounterCreateForm" oncomplete="PF('EncounterCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="View" update=":EncounterViewForm" oncomplete="PF('EncounterViewDialog').show()" disabled="#{empty encounterController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="Edit" update=":EncounterEditForm" oncomplete="PF('EncounterEditDialog').show()" disabled="#{empty encounterController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="Delete" actionListener="#{encounterController.destroy}" update=":growl,datalistEncounters" disabled="#{empty encounterController.selected}"/>
                            <p:commandButton id="backButton" value="BACK" action="/iPA/StaffHome" update=":growl,datalistEncounters" />
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

        </ui:define>
    </ui:composition>

</html>
