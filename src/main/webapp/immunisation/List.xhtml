<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">

        <ui:define name="title">
            <h:outputText value="Immunisations"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>

            <p:growl id="growl" showDetail="true">
                <p:autoUpdate/>
            </p:growl>
                        <h3>Immunisation</h3>

            <h:form id="ImmunisationListForm">
                
                <p:panel id="pnlUserHome" header="Identifier" styleClass="ui-fluid">
                    <h:panelGrid columns="10" rendered="#{!empty identifierController.selected}" cellspacing="10px;" style="width:100%;" >
                        <h:outputText value="ID" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.id}"/>                    
                        <h:outputText value="USE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.use}"/>                                            
                        <h:outputText value="VALUE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.value}"/>                    
                        <h:outputText value="TYPE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.IType}"/>
                    </h:panelGrid>
                </p:panel>

                <p:panel header="Immunisations" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{immunisationController.items}" var="item"
                                 selectionMode="single" selection="#{immunisationController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Id"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status"/>
                            </f:facet>
                            <h:outputText value="#{item.IStatus}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status Reason"/>
                            </f:facet>
                            <h:outputText value="#{item.statusReason}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Vaccine Code"/>
                            </f:facet>
                            <h:outputText value="#{item.vaccineCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Occurence Date"/>
                            </f:facet>
                            <h:outputText value="#{item.occurenceDate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Occurence String"/>
                            </f:facet>
                            <h:outputText value="#{item.occurenceString}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Primary Source"/>
                            </f:facet>
                            <p:selectBooleanCheckbox value="#{item.primarySource}" disabled="true"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Report Origin"/>
                            </f:facet>
                            <h:outputText value="#{item.reportOrigin}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Lot Number"/>
                            </f:facet>
                            <h:outputText value="#{item.lotNumber}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Expiration Date"/>
                            </f:facet>
                            <h:outputText value="#{item.expirationDate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Site"/>
                            </f:facet>
                            <h:outputText value="#{item.site}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Route"/>
                            </f:facet>
                            <h:outputText value="#{item.route}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Dose Quantity"/>
                            </f:facet>
                            <h:outputText value="#{item.doseQuantity}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Note"/>
                            </f:facet>
                            <h:outputText value="#{item.note}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Reason Code"/>
                            </f:facet>
                            <h:outputText value="#{item.reasonCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Is Sub-potent"/>
                            </f:facet>
                            <p:selectBooleanCheckbox value="#{item.isSubpotent}" disabled="true"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Sub-potent Reason"/>
                            </f:facet>
                            <h:outputText value="#{item.subpotentReason}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Program Eligibility"/>
                            </f:facet>
                            <h:outputText value="#{item.programEligibility}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Funding Source"/>
                            </f:facet>
                            <h:outputText value="#{item.fundingSource}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Reaction Date"/>
                            </f:facet>
                            <h:outputText value="#{item.reactionDate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Reaction Detail"/>
                            </f:facet>
                            <h:outputText value="#{item.reactionDetail}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Reaction Reported"/>
                            </f:facet>
                            <p:selectBooleanCheckbox value="#{item.reactionReported}" disabled="true"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{immunisationController.prepareCreate}" update=":ImmunisationCreateForm" oncomplete="PF('ImmunisationCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":ImmunisationViewForm" oncomplete="PF('ImmunisationViewDialog').show()" disabled="#{empty immunisationController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":ImmunisationEditForm" oncomplete="PF('ImmunisationEditDialog').show()" disabled="#{empty immunisationController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{immunisationController.destroy}" update=":growl,datalist" disabled="#{empty immunisationController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
