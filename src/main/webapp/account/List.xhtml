<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">

        <ui:define name="title">
            <h:outputText value="Accounts"></h:outputText>
        </ui:define>

        <ui:define name="content">
            
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            
            <ui:include src="/chargeItem/Create.xhtml"/>
            <ui:include src="/invoice/Create.xhtml"/>
            
            <p:growl id="growl">
                <p:autoUpdate/>
            </p:growl>

            <h3>Accounts</h3>
            <h:form id="AccountListForm">
                <p:panel id="pnlUserHome" header="Identifier" styleClass="ui-fluid">
                    <h:panelGrid columns="10" rendered="#{!empty identifierController.selected}" cellspacing="10px;" style="width:100%;" >
                        <h:outputText value="ID" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.id}"/>                    
                        <h:outputText value="USE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.use}"/>                                            
                        <h:outputText value="VALUE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.value}"/>                    
                        <h:outputText value="TYPE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.IType}"/>
                    </h:panelGrid>
                </p:panel>
            
                <p:panel header="List Accounts" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{accountController.items}" var="item"
                                 selectionMode="single" selection="#{accountController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton :AccountListForm:createChargeItemButton :AccountListForm:createInvoiceButton :AccountListForm:viewInvoicesButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton :AccountListForm:createChargeItemButton :AccountListForm:createInvoiceButton :AccountListForm:viewInvoicesButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Id"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Status"/>
                            </f:facet>
                            <h:outputText value="#{item.status}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Billing Status"/>
                            </f:facet>
                            <h:outputText value="#{item.billingStatus}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Type"/>
                            </f:facet>
                            <h:outputText value="#{item.type}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Name"/>
                            </f:facet>
                            <h:outputText value="#{item.name}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Service From"/>
                            </f:facet>
                            <h:outputText value="#{item.servicePeriodFrom}">
                                <f:convertDateTime pattern="MM/dd/yyyy" />
                            </h:outputText>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Service To"/>
                            </f:facet>
                            <h:outputText value="#{item.servicePeriodTo}">
                                <f:convertDateTime pattern="MM/dd/yyyy" />
                            </h:outputText>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </p:column>                        
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{accountController.prepareCreate}" update=":AccountCreateForm" oncomplete="PF('AccountCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":AccountViewForm" oncomplete="PF('AccountViewDialog').show()" disabled="#{empty accountController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":AccountEditForm" oncomplete="PF('AccountEditDialog').show()" disabled="#{empty accountController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{accountController.destroy}" update=":growl,datalist" disabled="#{empty accountController.selected}"/>                            
                        </f:facet>
                    </p:dataTable>
                    
                    <p:commandButton id="createChargeItemButton" icon="ui-icon-plus" value="Charge Selected Item" actionListener="#{chargeItemController.prepareCreate}" update=":ChargeItemCreateForm" oncomplete="PF('ChargeItemCreateDialog').show()" disabled="#{empty accountController.selected}"/>
                    <p:commandButton id="createInvoiceButton" icon="ui-icon-document" value="Generate Invoice" update=":ChargeItemCreateForm" oncomplete="PF('GenerateInvoicesDialog').show()" disabled="#{empty accountController.selected}"/>
                    <p:commandButton id="viewInvoicesButton" icon="ui-icon-suitcase" value="View Invoices" actionListener="#{chargeItemController.prepareCreate}" update=":ChargeItemCreateForm" oncomplete="PF('ChargeItemCreateDialog').show()" disabled="#{empty accountController.selected}"/>
                </p:panel>
            </h:form>

            <p:dialog id="GenerateInvoices" widgetVar="GenerateInvoicesDialog" modal="true" resizable="false" appendTo="@(dialog)" header="Generate Invoices" styleClass="ui-fluid">
            <h:form id="GenerateInvoicesForm">
                <h:panelGroup id="display">
                    <h5>Generate a new Invoice for the current Encounter?</h5>
                    <p:commandButton value="Yes" action="#{chargeItemController.generateInvoice()}" update="display,:growl" oncomplete="handleSubmit(args,'GenerateInvoicesDialog');"/>
                    <p:commandButton value="No" onclick="AccountViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        </ui:define>
    </ui:composition>

</html>
