<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="CPTCSMProceduresCreateDlg" widgetVar="CPTCSMProceduresCreateDialog" modal="true" resizable="false" appendTo="@(dialog)" header="#{bundle.CreateCPTCSMProceduresTitle}" styleClass="ui-fluid">
            <h:form id="CPTCSMProceduresCreateForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{cPTCSMProceduresController.selected != null}">
                        <p:outputLabel value="Procedure Code Category" for="procedureCodeCategory" />
                        <p:inputText id="CHClass" value="#{cPTCSMProceduresController.selected.procedureCodeCategory}" title="#{bundle.CreateCPTCSMProceduresTitle_CHClass}" />
                        <p:outputLabel value="#{bundle.CreateCPTCSMProceduresLabel_periodFrom}" for="periodFrom" />
                        <p:inputText id="periodFrom" value="#{cPTCSMProceduresController.selected.periodFrom}" title="#{bundle.CreateCPTCSMProceduresTitle_periodFrom}" />
                        <p:outputLabel value="#{bundle.CreateCPTCSMProceduresLabel_periodTo}" for="periodTo" />
                        <p:inputText id="periodTo" value="#{cPTCSMProceduresController.selected.periodTo}" title="#{bundle.CreateCPTCSMProceduresTitle_periodTo}" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{cPTCSMProceduresController.create}" value="#{bundle.Save}" update="display,:CPTCSMProceduresListForm:datalist,:growl" oncomplete="handleSubmit(args,'CPTCSMProceduresCreateDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="CPTCSMProceduresCreateDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
