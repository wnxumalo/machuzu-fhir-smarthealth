<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="International Patient Access (IPA)"></h:outputText>
        </ui:define>

        <ui:define name="content">
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>

            <ui:include src="/reaction/Create.xhtml"/>
            <ui:include src="/reaction/Edit.xhtml"/>
            <ui:include src="/reaction/View.xhtml"/>

            <p:growl id="growl">
                <p:autoUpdate/>
            </p:growl>

            <h3>Allergies</h3>
            <h:form id="AllergyListForm">
                <p:panel id="pnlUserHome" header="Identifier" styleClass="ui-fluid">
                    <h:panelGrid columns="10" rendered="#{!empty identifierController.selected}" cellspacing="10px;" style="width:100%;" >
                        <h:outputText value="ID" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.id}"/>                    
                        <h:outputText value="USE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.use}"/>                                            
                        <h:outputText value="VALUE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.value}"/>                    
                        <h:outputText value="TYPE" style="font-weight: bold;"/>
                        <h:outputText value="#{identifierController.selected.IType}"/>
                    </h:panelGrid>
                </p:panel>

                <p:panel header="Allergies" styleClass="ui-fluid">

                    <p:dataTable id="datalist" value="#{encounterController.selected.allergies}" var="item"
                                 selectionMode="single" selection="#{allergyController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton,viewButton,editButton,deleteButton,:AllergyListForm:datalistReactions"/>
                        <p:ajax event="rowUnselect" update="createButton,viewButton,editButton,deleteButton,:AllergyListForm:datalistReactions"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.note}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Clinical Status"/>
                            </f:facet>
                            <p:selectBooleanCheckbox value="#{item.clinicalStatus}" disabled="true"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Verification Status"/>
                            </f:facet>
                            <h:outputText value="#{item.verificationStatus}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Type"/>
                            </f:facet>
                            <h:outputText value="#{item.type}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Category"/>
                            </f:facet>
                            <h:outputText value="#{item.category}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Criticality"/>
                            </f:facet>
                            <h:outputText value="#{item.criticality}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Code"/>
                            </f:facet>
                            <h:outputText value="#{item.ACode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Onset Date"/>
                            </f:facet>
                            <h:outputText value="#{item.onsetDateTime}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Age"/>
                            </f:facet>
                            <h:outputText value="#{item.onsetAge}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Period From"/>
                            </f:facet>
                            <h:outputText value="#{item.onsetPeriodFrom}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Period To"/>
                            </f:facet>
                            <h:outputText value="#{item.onsetPeriodTo}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Onset Range"/>
                            </f:facet>
                            <h:outputText value="#{item.onsetRange}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Onset String"/>
                            </f:facet>
                            <h:outputText value="#{item.onsetString}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Recorded Date"/>
                            </f:facet>
                            <h:outputText value="#{item.recordedDate}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Last Occurrence"/>
                            </f:facet>
                            <h:outputText value="#{item.lastOccurrence}"/>
                        </p:column>                        
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{allergyController.prepareCreate}" update=":AllergyCreateForm" oncomplete="PF('AllergyCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":AllergyViewForm" oncomplete="PF('AllergyViewDialog').show()" disabled="#{empty allergyController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":AllergyEditForm" oncomplete="PF('AllergyEditDialog').show()" disabled="#{empty allergyController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{allergyController.destroy}" update=":growl,datalist" disabled="#{empty allergyController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>

                <p:panel header="Reactions" styleClass="ui-fluid">

                    <p:dataTable id="datalistReactions" value="#{allergyController.selected.reaction}" var="item"
                                 selectionMode="single" selection="#{reactionController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Substance"/>
                            </f:facet>
                            <h:outputText value="#{item.substance}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Manifestation"/>
                            </f:facet>
                            <h:outputText value="#{item.manifestation}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Onset"/>
                            </f:facet>
                            <h:outputText value="#{item.onset}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Severity"/>
                            </f:facet>
                            <h:outputText value="#{item.severity}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Route"/>
                            </f:facet>
                            <h:outputText value="#{item.exposureRoute}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Note"/>
                            </f:facet>
                            <h:outputText value="#{item.note}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{reactionController.prepareCreate}" update=":ReactionCreateForm" oncomplete="PF('ReactionCreateDialog').show()" disabled="#{empty allergyController.selected}"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":ReactionViewForm" oncomplete="PF('ReactionViewDialog').show()" disabled="#{empty reactionController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":ReactionEditForm" oncomplete="PF('ReactionEditDialog').show()" disabled="#{empty reactionController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{reactionController.destroy}" update=":growl,datalistReactions" disabled="#{empty reactionController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>


            </h:form>

        </ui:define>
    </ui:composition>

</html>
