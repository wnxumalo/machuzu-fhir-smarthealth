<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="IllnessCreateDlg" widgetVar="IllnessCreateDialog" modal="true" resizable="false" appendTo="@(body)" header="#{bundle.CreateIllnessTitle}">
            <h:form id="IllnessCreateForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{illnessController.selected != null}">
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_id}" for="id" />
                        <p:inputText id="id" value="#{illnessController.selected.id}" title="#{bundle.CreateIllnessTitle_id}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_encounter}" for="encounter" />
                        <p:inputText id="encounter" value="#{illnessController.selected.encounter}" title="#{bundle.CreateIllnessTitle_encounter}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_clinicalStatus}" for="clinicalStatus" />
                        <p:inputText id="clinicalStatus" value="#{illnessController.selected.clinicalStatus}" title="#{bundle.CreateIllnessTitle_clinicalStatus}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_verificationStatus}" for="verificationStatus" />
                        <p:inputText id="verificationStatus" value="#{illnessController.selected.verificationStatus}" title="#{bundle.CreateIllnessTitle_verificationStatus}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_serviceType}" for="serviceType" />
                        <p:inputText id="serviceType" value="#{illnessController.selected.serviceType}" title="#{bundle.CreateIllnessTitle_serviceType}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_severity}" for="severity" />
                        <p:inputText id="severity" value="#{illnessController.selected.severity}" title="#{bundle.CreateIllnessTitle_severity}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_code}" for="code" />
                        <p:inputText id="code" value="#{illnessController.selected.code}" title="#{bundle.CreateIllnessTitle_code}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_bodySite}" for="bodySite" />
                        <p:inputText id="bodySite" value="#{illnessController.selected.bodySite}" title="#{bundle.CreateIllnessTitle_bodySite}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_recordedDate}" for="recordedDate" />
                        <p:inputText id="recordedDate" value="#{illnessController.selected.recordedDate}" title="#{bundle.CreateIllnessTitle_recordedDate}" />
                        <p:outputLabel value="#{bundle.CreateIllnessLabel_note}" for="note" />
                        <p:inputText id="note" value="#{illnessController.selected.note}" title="#{bundle.CreateIllnessTitle_note}" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{illnessController.create}" value="#{bundle.Save}" update="display,:IllnessListForm:datalist,:growl" oncomplete="handleSubmit(args,'IllnessCreateDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="IllnessCreateDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
