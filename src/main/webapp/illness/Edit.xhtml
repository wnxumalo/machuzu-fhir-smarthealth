<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="IllnessEditDlg" widgetVar="IllnessEditDialog" modal="true" resizable="false" appendTo="@(body)" header="#{bundle.EditIllnessTitle}">
            <h:form id="IllnessEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{illnessController.selected != null}">
                        <p:outputLabel value="#{bundle.EditIllnessLabel_id}" for="id" />
                        <p:inputText id="id" value="#{illnessController.selected.id}" title="#{bundle.EditIllnessTitle_id}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_encounter}" for="encounter" />
                        <p:inputText id="encounter" value="#{illnessController.selected.encounter}" title="#{bundle.EditIllnessTitle_encounter}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_clinicalStatus}" for="clinicalStatus" />
                        <p:inputText id="clinicalStatus" value="#{illnessController.selected.clinicalStatus}" title="#{bundle.EditIllnessTitle_clinicalStatus}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_verificationStatus}" for="verificationStatus" />
                        <p:inputText id="verificationStatus" value="#{illnessController.selected.verificationStatus}" title="#{bundle.EditIllnessTitle_verificationStatus}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_serviceType}" for="serviceType" />
                        <p:inputText id="serviceType" value="#{illnessController.selected.serviceType}" title="#{bundle.EditIllnessTitle_serviceType}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_severity}" for="severity" />
                        <p:inputText id="severity" value="#{illnessController.selected.severity}" title="#{bundle.EditIllnessTitle_severity}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_code}" for="code" />
                        <p:inputText id="code" value="#{illnessController.selected.code}" title="#{bundle.EditIllnessTitle_code}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_bodySite}" for="bodySite" />
                        <p:inputText id="bodySite" value="#{illnessController.selected.bodySite}" title="#{bundle.EditIllnessTitle_bodySite}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_recordedDate}" for="recordedDate" />
                        <p:inputText id="recordedDate" value="#{illnessController.selected.recordedDate}" title="#{bundle.EditIllnessTitle_recordedDate}" />
                        <p:outputLabel value="#{bundle.EditIllnessLabel_note}" for="note" />
                        <p:inputText id="note" value="#{illnessController.selected.note}" title="#{bundle.EditIllnessTitle_note}" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{illnessController.update}" value="#{bundle.Save}" update="display,:IllnessListForm:datalist,:growl" oncomplete="handleSubmit(args, 'IllnessEditDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="IllnessEditDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
