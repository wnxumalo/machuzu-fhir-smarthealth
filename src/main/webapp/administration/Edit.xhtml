<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="AdministrationEditDlg" widgetVar="AdministrationEditDialog" modal="true" resizable="false" appendTo="@(dialog)" header="#{bundle.EditAdministrationTitle}" styleClass="ui-fluid">
            <h:form id="AdministrationEditForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{administrationController.selected != null}">
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_id}" for="id" />
                        <p:inputText id="id" value="#{administrationController.selected.id}" title="#{bundle.EditAdministrationTitle_id}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_employeeNo}" for="employeeNo" />
                        <p:inputText id="employeeNo" value="#{administrationController.selected.employeeNo}" title="#{bundle.EditAdministrationTitle_employeeNo}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_idNumber}" for="idNumber" />
                        <p:inputText id="idNumber" value="#{administrationController.selected.idNumber}" title="#{bundle.EditAdministrationTitle_idNumber}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_employmentDate}" for="employmentDate" />
                        <p:calendar id="employmentDate" pattern="MM/dd/yyyy" value="#{administrationController.selected.employmentDate}" title="#{bundle.EditAdministrationTitle_employmentDate}"  showOn="button"/>
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_name}" for="name" />
                        <p:inputText id="name" value="#{administrationController.selected.name}" title="#{bundle.EditAdministrationTitle_name}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_surname}" for="surname" />
                        <p:inputText id="surname" value="#{administrationController.selected.surname}" title="#{bundle.EditAdministrationTitle_surname}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_gender}" for="gender" />
                        <p:inputText id="gender" value="#{administrationController.selected.gender}" title="#{bundle.EditAdministrationTitle_gender}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_startDay}" for="startDay" />
                        <p:calendar id="startDay" pattern="MM/dd/yyyy" value="#{administrationController.selected.startDay}" title="#{bundle.EditAdministrationTitle_startDay}"  showOn="button"/>
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_lastDay}" for="lastDay" />
                        <p:calendar id="lastDay" pattern="MM/dd/yyyy" value="#{administrationController.selected.lastDay}" title="#{bundle.EditAdministrationTitle_lastDay}"  showOn="button"/>
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_contact}" for="contact" />
                        <p:inputText id="contact" value="#{administrationController.selected.contact}" title="#{bundle.EditAdministrationTitle_contact}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_designation}" for="designation" />
                        <p:inputText id="designation" value="#{administrationController.selected.designation}" title="#{bundle.EditAdministrationTitle_designation}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_department}" for="department" />
                        <p:inputText id="department" value="#{administrationController.selected.department}" title="#{bundle.EditAdministrationTitle_department}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_section}" for="section" />
                        <p:inputText id="section" value="#{administrationController.selected.section}" title="#{bundle.EditAdministrationTitle_section}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_level}" for="level" />
                        <p:inputText id="level" value="#{administrationController.selected.level}" title="#{bundle.EditAdministrationTitle_level}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_status}" for="status" />
                        <p:inputText id="status" value="#{administrationController.selected.status}" title="#{bundle.EditAdministrationTitle_status}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_email}" for="email" />
                        <p:inputText id="email" value="#{administrationController.selected.email}" title="#{bundle.EditAdministrationTitle_email}" />
                        <p:outputLabel value="#{bundle.EditAdministrationLabel_password}" for="password" />
                        <p:inputText id="password" value="#{administrationController.selected.password}" title="#{bundle.EditAdministrationTitle_password}" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{administrationController.update}" value="#{bundle.Save}" update="display,:AdministrationListForm:datalist,:growl" oncomplete="handleSubmit(args, 'AdministrationEditDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="AdministrationEditDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
