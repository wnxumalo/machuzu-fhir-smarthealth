<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="#{bundle.ListDosageTitle}"></h:outputText>
        </ui:define>

        <ui:define name="body">
            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
            
            <h:form id="DosageListForm">
                <p:panel header="#{bundle.ListDosageTitle}" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{dosageController.items}" var="item"
                                 selectionMode="single" selection="#{dosageController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_medicationRequest}"/>
                            </f:facet>
                            <h:outputText value="#{item.medicationRequest}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_sequence}"/>
                            </f:facet>
                            <h:outputText value="#{item.sequence}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_text}"/>
                            </f:facet>
                            <h:outputText value="#{item.text}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_additionalInstruction}"/>
                            </f:facet>
                            <h:outputText value="#{item.additionalInstruction}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_patientInstruction}"/>
                            </f:facet>
                            <h:outputText value="#{item.patientInstruction}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_timing}"/>
                            </f:facet>
                            <h:outputText value="#{item.timing}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_asNeeded}"/>
                            </f:facet>
                            <p:selectBooleanCheckbox value="#{item.asNeeded}" disabled="true"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_site}"/>
                            </f:facet>
                            <h:outputText value="#{item.site}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_route}"/>
                            </f:facet>
                            <h:outputText value="#{item.route}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_method}"/>
                            </f:facet>
                            <h:outputText value="#{item.method}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_maxDosePerPeriodNumerator}"/>
                            </f:facet>
                            <h:outputText value="#{item.maxDosePerPeriodNumerator}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_maxDosePerPeriodDenominator}"/>
                            </f:facet>
                            <h:outputText value="#{item.maxDosePerPeriodDenominator}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListDosageTitle_maxDosePerLifetime}"/>
                            </f:facet>
                            <h:outputText value="#{item.maxDosePerLifetime}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{dosageController.prepareCreate}" update=":DosageCreateForm" oncomplete="PF('DosageCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":DosageViewForm" oncomplete="PF('DosageViewDialog').show()" disabled="#{empty dosageController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":DosageEditForm" oncomplete="PF('DosageEditDialog').show()" disabled="#{empty dosageController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{dosageController.destroy}" update=":growl,datalist" disabled="#{empty dosageController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

        </ui:define>
    </ui:composition>

</html>
