<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">


        <ui:define name="title">
            <h:outputText value="#{bundle.ListCarePlanActivityTitle}"></h:outputText>
        </ui:define>

        <ui:define name="body">
            <h:form id="CarePlanActivityListForm">
                <p:panel header="#{bundle.ListCarePlanActivityTitle}" styleClass="ui-fluid">
                    <p:dataTable id="datalist" value="#{carePlanActivityController.items}" var="item"
                                 selectionMode="single" selection="#{carePlanActivityController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 >

                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_careplan}"/>
                            </f:facet>
                            <h:outputText value="#{item.careplan}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_outcomeCodeableConcept}"/>
                            </f:facet>
                            <h:outputText value="#{item.outcomeCodeableConcept}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_progress}"/>
                            </f:facet>
                            <h:outputText value="#{item.progress}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_detailKind}"/>
                            </f:facet>
                            <h:outputText value="#{item.detailKind}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_detailCode}"/>
                            </f:facet>
                            <h:outputText value="#{item.detailCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_detailReasonCode}"/>
                            </f:facet>
                            <h:outputText value="#{item.detailReasonCode}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_status}"/>
                            </f:facet>
                            <h:outputText value="#{item.status}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_statusReason}"/>
                            </f:facet>
                            <h:outputText value="#{item.statusReason}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_doNotPerform}"/>
                            </f:facet>
                            <p:selectBooleanCheckbox value="#{item.doNotPerform}" disabled="true"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_scheduledPeriodFrom}"/>
                            </f:facet>
                            <h:outputText value="#{item.scheduledPeriodFrom}">
                                <f:convertDateTime pattern="MM/dd/yyyy" />
                            </h:outputText>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_scheduledPeriodTo}"/>
                            </f:facet>
                            <h:outputText value="#{item.scheduledPeriodTo}">
                                <f:convertDateTime pattern="MM/dd/yyyy" />
                            </h:outputText>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_productCodeCodeableConcept}"/>
                            </f:facet>
                            <h:outputText value="#{item.productCodeCodeableConcept}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_productReference}"/>
                            </f:facet>
                            <h:outputText value="#{item.productReference}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_dailyAmount}"/>
                            </f:facet>
                            <h:outputText value="#{item.dailyAmount}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_quantity}"/>
                            </f:facet>
                            <h:outputText value="#{item.quantity}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCarePlanActivityTitle_description}"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton id="createButton" icon="ui-icon-plus"   value="#{bundle.Create}" actionListener="#{carePlanActivityController.prepareCreate}" update=":CarePlanActivityCreateForm" oncomplete="PF('CarePlanActivityCreateDialog').show()"/>
                            <p:commandButton id="viewButton"   icon="ui-icon-search" value="#{bundle.View}" update=":CarePlanActivityViewForm" oncomplete="PF('CarePlanActivityViewDialog').show()" disabled="#{empty carePlanActivityController.selected}"/>
                            <p:commandButton id="editButton"   icon="ui-icon-pencil" value="#{bundle.Edit}" update=":CarePlanActivityEditForm" oncomplete="PF('CarePlanActivityEditDialog').show()" disabled="#{empty carePlanActivityController.selected}"/>
                            <p:commandButton id="deleteButton" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{carePlanActivityController.destroy}" update=":growl,datalist" disabled="#{empty carePlanActivityController.selected}"/>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
        </ui:define>
    </ui:composition>

</html>
