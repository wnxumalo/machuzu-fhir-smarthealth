<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="ContactPointViewDlg" widgetVar="ContactPointViewDialog" modal="true" resizable="false" appendTo="@(dialog)" header="View Contact Point" styleClass="ui-fluid">
            <h:form id="ContactPointViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{contactPointController.selected != null}">
                        <h:outputText value="System"/>
                        <h:outputText value="#{contactPointController.selected.telecomSystem}" title="#{bundle.ViewContactPointTitle_telecomSystem}"/>
                        <h:outputText value="Rank"/>
                        <h:outputText value="#{contactPointController.selected.telecomRank}" title="#{bundle.ViewContactPointTitle_telecomRank}"/>
                        <h:outputText value="Value"/>
                        <h:outputText value="#{contactPointController.selected.telecomValue}" title="#{bundle.ViewContactPointTitle_telecomValue}"/>
                        <h:outputText value="Use"/>
                        <h:outputText value="#{contactPointController.selected.telecomUse}" title="#{bundle.ViewContactPointTitle_telecomUse}"/>
                        <h:outputText value="Valid From"/>
                        <h:outputText value="#{contactPointController.selected.telecomPeriodFrom}" title="#{bundle.ViewContactPointTitle_telecomPeriod}"/>
                        <h:outputText value="Valid To"/>
                        <h:outputText value="#{contactPointController.selected.telecomPeriodTo}" title="#{bundle.ViewContactPointTitle_telecomPeriod}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="ContactPointViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
