<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="ConditionStageViewDlg" widgetVar="ConditionStageViewDialog" modal="true" resizable="false" appendTo="@(body)" header="#{bundle.ViewConditionStageTitle}">
            <h:form id="ConditionStageViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{conditionStageController.selected != null}">
                        <h:outputText value="#{bundle.ViewConditionStageLabel_id}"/>
                        <h:outputText value="#{conditionStageController.selected.id}" title="#{bundle.ViewConditionStageTitle_id}"/>
                        <h:outputText value="#{bundle.ViewConditionStageLabel_condition}"/>
                        <h:outputText value="#{conditionStageController.selected.condition}" title="#{bundle.ViewConditionStageTitle_condition}"/>
                        <h:outputText value="#{bundle.ViewConditionStageLabel_summary}"/>
                        <h:outputText value="#{conditionStageController.selected.summary}" title="#{bundle.ViewConditionStageTitle_summary}"/>
                        <h:outputText value="#{bundle.ViewConditionStageLabel_stageType}"/>
                        <h:outputText value="#{conditionStageController.selected.stageType}" title="#{bundle.ViewConditionStageTitle_stageType}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="ConditionStageViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
