<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="ConditionStageCreateDlg" widgetVar="ConditionStageCreateDialog" modal="true" resizable="false" appendTo="@(body)" header="#{bundle.CreateConditionStageTitle}">
            <h:form id="ConditionStageCreateForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{conditionStageController.selected != null}">
                        <p:outputLabel value="#{bundle.CreateConditionStageLabel_id}" for="id" />
                        <p:inputText id="id" value="#{conditionStageController.selected.id}" title="#{bundle.CreateConditionStageTitle_id}" />
                        <p:outputLabel value="#{bundle.CreateConditionStageLabel_condition}" for="condition" />
                        <p:inputText id="condition" value="#{conditionStageController.selected.condition}" title="#{bundle.CreateConditionStageTitle_condition}" />
                        <p:outputLabel value="#{bundle.CreateConditionStageLabel_summary}" for="summary" />
                        <p:inputText id="summary" value="#{conditionStageController.selected.summary}" title="#{bundle.CreateConditionStageTitle_summary}" />
                        <p:outputLabel value="#{bundle.CreateConditionStageLabel_stageType}" for="stageType" />
                        <p:inputText id="stageType" value="#{conditionStageController.selected.stageType}" title="#{bundle.CreateConditionStageTitle_stageType}" />
                    </p:panelGrid>
                    <p:commandButton actionListener="#{conditionStageController.create}" value="#{bundle.Save}" update="display,:ConditionStageListForm:datalist,:growl" oncomplete="handleSubmit(args,'ConditionStageCreateDialog');"/>
                    <p:commandButton value="#{bundle.Cancel}" onclick="ConditionStageCreateDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
