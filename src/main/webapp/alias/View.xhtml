<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="AliasViewDlg" widgetVar="AliasViewDialog" modal="true" resizable="false" appendTo="@(dialog)" header="#{bundle.ViewAliasTitle}" styleClass="ui-fluid">
            <h:form id="AliasViewForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{aliasController.selected != null}">
                        <h:outputText value="#{bundle.ViewAliasLabel_id}"/>
                        <h:outputText value="#{aliasController.selected.id}" title="#{bundle.ViewAliasTitle_id}"/>
                        <h:outputText value="#{bundle.ViewAliasLabel_name}"/>
                        <h:outputText value="#{aliasController.selected.name}" title="#{bundle.ViewAliasTitle_name}"/>
                        <h:outputText value="#{bundle.ViewAliasLabel_IPA}"/>
                        <h:outputText value="#{aliasController.selected.IPA}" title="#{bundle.ViewAliasTitle_IPA}"/>
                    </p:panelGrid>
                    <p:commandButton value="#{bundle.Close}" onclick="AliasViewDialog.hide()"/>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
